# fixtures/manifest.yaml
#
# T-4.1 hand-built fixture-corpus label manifest.
#
# Sizing rule (spec.md gate-4, locked): cases = max(min_floor, 2 * count(detectable_scenarios)),
# class-balanced vulnerable/clean, drawn only from each category's static-detectable tier.
# A category whose detectable tier is empty publishes no F1 and is reported
# declared-and-uncovered rather than padded to manufacture a number (S-003).
#
# tier_lock_hash binds each category's fixture labeling to the scenario tiering it was
# labeled against (sha256 over sorted "scenario_id:tier" pairs across BOTH the
# detectable_scenarios and out_of_artifact_scenarios lists). If a scenario's tier is later
# reclassified, recomputing this hash no longer matches the stored value, which flags the
# category for re-labeling and a judge re-run before its F1 can be republished (S-011).
#
# ---------------------------------------------------------------------------------------
# PROVENANCE — RECONCILED AGAINST scenarios/registry.yaml (T-3.1a)
# ---------------------------------------------------------------------------------------
# scenarios/registry.yaml is now authoritative on tier. It enumerates all 62 attack
# scenarios named in the whitepaper's ten "Attack Scenarios" sections — not the 58 this
# file's earlier provenance note assumed; four scenarios appear as body sub-headings the
# document's own table of contents omits.
#
# Every scenario entry below now declares:
#   registry_ids  the registry scenario(s) it is drawn from (empty only for
#                 covers: category-precondition, which must then state a `derivation`).
#   covers        how honestly the fixture pair measures those scenarios:
#                   full                  — the registry tiers every linked scenario
#                                           static-detectable, so the corpus measures the
#                                           scenario itself.
#                   artifact-signal-only  — the registry does NOT tier the linked scenario
#                                           static-detectable; the corpus measures that
#                                           scenario's declared `artifact_signal` (an
#                                           enabling precondition) and MUST NOT be reported
#                                           as coverage of the scenario.
#                   category-precondition — the check derives from the category's preventive
#                                           mitigations rather than from any named scenario.
#
# Reconciliation outcomes (registry won in every case):
#   * AST02 / AST07 / AST09 / AST10 — the out-of-artifact declarations were partial. They
#     are re-keyed to canonical registry ids and exact whitepaper titles and expanded to
#     every out-of-artifact scenario the registry names for the category (AST02 1 -> 3,
#     AST07 2 -> 3, AST09 3 -> 7, AST10 2 -> 5). Tiers agreed; only completeness changed.
#   * AST05 — the registry tiers NONE of AST05's six named scenarios static-detectable.
#     The three labeled checks are re-declared covers: artifact-signal-only: this corpus
#     measures unpinned-reference / missing-boundary detection, NOT rug-pull,
#     bait-and-switch, chaining, or relay amplification. status covered -> proxy-covered.
#   * AST03 — two of three checks demoted to artifact-signal-only (the scenarios they
#     proxy are agent-judgable and out-of-artifact respectively). status -> proxy-covered.
#   * AST06 — one of three checks demoted to artifact-signal-only. status -> proxy-covered.
#   * AST08 — the single labeled check maps to NO named AST08 scenario; it derives from the
#     category's mitigations. Declared covers: category-precondition, status ->
#     proxy-covered. All four of AST08's static-detectable named scenarios are uncovered.
#   * AST01 — the three checks map cleanly, but two of them to scenarios the registry files
#     under OTHER categories (AST08-S02 obfuscation, AST02-S03 config-file hijacking). The
#     link is recorded rather than reassigned; the fixtures are unchanged.
#   * AST04 — the only category whose corpus and the registry agreed outright.
#
# CORPUS-SIZE FORMULA. Unchanged and still satisfied: declared_expected_cases =
# max(min_floor, 2 * count(detectable_scenarios)) over the checks this corpus actually
# labels, and every category still matches it. No detectable count changed, so no declared
# expected size moved. What the reconciliation DID change is the visible debt: the registry
# names 20 static-detectable scenarios across the ten categories and this corpus covers 8
# of them at covers: full. Each category's registry_coverage block records
# cases_at_full_static_coverage — the corpus size the formula would demand at full registry
# coverage — alongside its uncovered_static_detectable list. No fixture files were removed.

min_floor: 6
formula: "max(min_floor, 2 * count(detectable_scenarios))"
registry: "scenarios/registry.yaml"
registry_scenario_count: 62

categories:
  AST01:
    name: "Malicious Skills"
    tier_lock_hash: "41ab0facbcd32f2d5e385cd5bbcf15a40328162e8391fc717c2b7821510aa3ad"
    status: covered
    f1_scope: scenario-level
    published_f1: "pending-detector"
    registry_coverage:
      registry_scenarios: 11
      registry_static_detectable: 7
      registry_agent_judgable: 3
      registry_out_of_artifact: 1
      cases_at_full_static_coverage: 14
      labeled_detectable_checks: 3
      declared_expected_cases: 6
      cases_present: 6
      uncovered_static_detectable:
        - AST01-S02
        - AST01-S05
        - AST01-S06
        - AST01-S08
        - AST01-S09
        - AST01-S11
      note: >-
        Two of the three labeled checks are drawn from registry scenarios the whitepaper
        files under other categories (AST08-S02, AST02-S03). Recorded, not reassigned:
        the fixtures measure a real static property either way, but AST01's own named
        static-detectable surface is 6/7 uncovered.
    detectable_scenarios:
      - id: AST01-S1
        name: "Obfuscated malicious payload in script"
        tier: static-detectable
        registry_ids: [AST08-S02]
        covers: full
        reason: "A base64/hex-encoded shell payload decoded and exec'd at load or run time is a fixed byte pattern a static scanner can flag by decoding and matching against known dangerous shell primitives. Registry parent AST08-S02 (Obfuscated Instruction) is tiered static-detectable for the same reason: the encoded blob is in the package's bytes and decode-then-rescan is deterministic."
      - id: AST01-S2
        name: "Destructive postinstall hook"
        tier: static-detectable
        registry_ids: [AST02-S03]
        covers: full
        reason: "A declared postinstall/setup script performing destructive filesystem operations (e.g. recursive delete of $HOME) disguised as environment cleanup is a static command-pattern match against the manifest's declared lifecycle hooks. Registry parent AST02-S03 (Config-File Hijacking) covers exactly this: execution instructions in a shipped config file that trigger automatically at project open."
      - id: AST01-S3
        name: "Covert exfiltration endpoint"
        tier: static-detectable
        registry_ids: [AST01-S10]
        covers: full
        reason: "A hardcoded HTTP endpoint in a script that POSTs local file contents outside any declared network policy is detectable by diffing egress calls in source against the manifest's declared allow-list. Registry parent AST01-S10 (Data Exfiltration) is tiered static-detectable on that same code-versus-manifest diff."
    out_of_artifact_scenarios:
      []
    cases:
      - id: AST01-V1
        scenario_id: AST01-S1
        label: vulnerable
        path: fixtures/AST01/V1-obfuscated-payload/SKILL.md
      - id: AST01-C2
        scenario_id: AST01-S1
        label: clean
        path: fixtures/AST01/C2-obfuscated-payload/SKILL.md
      - id: AST01-V3
        scenario_id: AST01-S2
        label: vulnerable
        path: fixtures/AST01/V3-destructive-postinstall/SKILL.md
      - id: AST01-C4
        scenario_id: AST01-S2
        label: clean
        path: fixtures/AST01/C4-destructive-postinstall/SKILL.md
      - id: AST01-V5
        scenario_id: AST01-S3
        label: vulnerable
        path: fixtures/AST01/V5-exfiltration-endpoint/SKILL.md
      - id: AST01-C6
        scenario_id: AST01-S3
        label: clean
        path: fixtures/AST01/C6-exfiltration-endpoint/SKILL.md

