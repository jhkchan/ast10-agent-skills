  AST10:
    name: "Cross-Platform Reuse"
    # Re-keyed to scenarios/registry.yaml's canonical ids and exact whitepaper titles, and
    # expanded from two out-of-artifact declarations to all five the registry names. The
    # sixth scenario (AST10-S06 Silent Supply Chain Injection) is tiered static-detectable
    # by the registry, and as of the detector work it is LABELED AND COVERED: six hand-built
    # cases, a shipped decode-and-rescan check, and a measured F1. tier_lock_hash therefore
    # moved (dba555f2... -> 42cb24ed...) because the entry list now carries AST10-S06 at
    # static-detectable; it is now identical to registry_tier_lock, which is the point — the
    # corpus mirrors the registry's tiering for this category exactly.
    tier_lock_hash: "42cb24ed85f5305ab26a57d54aec3361fc7b74d02155254342fd221b821bd4ae"
    registry_tier_lock: "42cb24ed85f5305ab26a57d54aec3361fc7b74d02155254342fd221b821bd4ae"
    status: covered
    f1_scope: scenario-level
    published_f1: 1.0
    registry_coverage:
      registry_scenarios: 6
      registry_static_detectable: 1
      registry_agent_judgable: 0
      registry_out_of_artifact: 5
      cases_at_full_static_coverage: 6
      labeled_detectable_checks: 1
      declared_expected_cases: 6
      cases_present: 6
      uncovered_static_detectable:
        []
      note: >-
        This category's single static-detectable scenario is covered at covers: full by
        skills/AST10/scripts/detector.py, which decodes the package's encoded blobs and
        evaluates the DECODED content layer — the whitepaper's own AST10 mitigation ("build
        platform-agnostic skill scanners that evaluate the content layer independently of
        the runtime"). published_f1 is the measured value over the six labeled cases, and
        skills/AST10/scripts/test_ast10_detector.py re-derives it from the corpus so it
        cannot be hand-written. Read it for exactly what it is: 3/3 precision and 3/3 recall
        on a hand-built corpus whose three CLEAN cases each carry a real encoded blob (a
        base64 PNG, a base64 JSON config block, a gzip-under-base64 policy document, and the
        USF hex content_hash and signature fields). It measures that the check separates
        payload from encoding across those six packages; it is not a generalisation claim
        about registries in the wild.
    detectable_scenarios:
      - id: AST10-S06
        name: "Silent Supply Chain Injection"
        tier: static-detectable
        registry_ids: [AST10-S06]
        covers: full
        detector_check: AST10-S06
        reason: "The scenario is a payload hidden inside an encoded script block that executes once imported 'without structural validation'. The shipped check performs exactly that structural validation over the package's own bytes: it decodes base64, bare-hex, \\xNN-escape and percent-encoded blobs (plus one gzip/zlib layer beneath them and one further encoding layer) and matches the DECODED content layer against payload behaviour, and separately flags a decoded literal reaching an execution sink. It needs no second manifest, no registry state and no runtime, so it decides the scenario itself rather than a precondition for it (scenarios/registry.yaml AST10-S06)."
    out_of_artifact_scenarios:
      - id: AST10-S01
        name: "Security Property Loss in Translation"
        tier: out-of-artifact
        registry_ids: [AST10-S01]
        covers: full
        reason: "Loss is a relation between a source manifest and a ported target manifest plus the target platform's schema; the whitepaper's own metadata loss simulator takes two manifests as input (scenarios/registry.yaml AST10-S01)."
      - id: AST10-S02
        name: "Cross-Registry Arbitrage"
        tier: out-of-artifact
        registry_ids: [AST10-S02]
        covers: full
        reason: "Detecting the same skill republished with different scan posture and install counts across registries requires a cross-registry corpus outside any single artifact; no in-artifact signal exists (scenarios/registry.yaml AST10-S02)."
      - id: AST10-S03
        name: "Multi-Platform Campaign"
        tier: out-of-artifact
        registry_ids: [AST10-S03]
        covers: full
        reason: "Detecting a coordinated campaign spanning multiple platforms requires cross-platform telemetry and a timeline outside any single artifact; one package looks like a lone publication (scenarios/registry.yaml AST10-S03)."
      - id: AST10-S04
        name: "Manifest Stripping"
        tier: out-of-artifact
        registry_ids: [AST10-S04]
        covers: full
        reason: "Deciding that metadata was stripped needs the pre-port manifest to compare against; a ported package with no permission block is indistinguishable from one that never declared any (scenarios/registry.yaml AST10-S04)."
      - id: AST10-S05
        name: "Implicit Privilege Escalation"
        tier: out-of-artifact
        registry_ids: [AST10-S05]
        covers: full
        reason: "The escalation is entirely a property of the target platform's default-permission model; the package's own declarations are unchanged and, read alone, look safe (scenarios/registry.yaml AST10-S05)."
    # Six cases = max(min_floor 6, 2 x 1 detectable scenario), class-balanced 3/3, paired
    # V/C by mechanism. Every CLEAN case carries a real encoded blob: the corpus is built so
    # that "does this package contain base64" scores 0.5, not 1.0.
