        reason: "A script that evaluates or exec's a third-party API response body directly as code is a static call-site match on eval/exec fed by a network response. It is NOT coverage of AST05-S05, which the registry tiers agent-judgable because the malicious document arrives at runtime and judging boundary adequacy is semantic; this pair measures that scenario's declared artifact_signal — fetched content routed into an executable sink."
