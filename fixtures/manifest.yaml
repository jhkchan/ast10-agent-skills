  AST05:
    name: "Untrusted External Instructions"
    tier_lock_hash: "3dc23889393d91e314c4eb3c52186cc807d00fd3c4f5ce0d9a05c03736753365"
    status: proxy-covered
    f1_scope: artifact-signal-only
    published_f1: "pending-detector"
