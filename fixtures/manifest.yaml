# fixtures/manifest.yaml
#
# T-4.1 hand-built fixture-corpus label manifest.
#
# Sizing rule (spec.md gate-4, locked): cases = max(min_floor, 2 * count(detectable_scenarios)),
# class-balanced vulnerable/clean, drawn only from each category's static-detectable tier.
# A category whose detectable tier is empty publishes no F1 and is reported
# declared-and-uncovered rather than padded to manufacture a number (S-003).
#
# tier_lock_hash binds each category's fixture labeling to the scenario tiering it was
# labeled against (sha256 over sorted "scenario_id:tier" pairs across BOTH the
# detectable_scenarios and out_of_artifact_scenarios lists). If a scenario's tier is later
# reclassified, recomputing this hash no longer matches the stored value, which flags the
# category for re-labeling and a judge re-run before its F1 can be republished (S-011).
#
# NOTE (provenance): the authoritative 58-scenario coverage matrix is T-3.1 and has not yet
# been authored in this repo. The detectable_scenarios / out_of_artifact_scenarios lists
# below are the minimal per-category tier declaration this fixture-labeling task depends
# on, scoped to what T-4.1 needs to label a corpus; they must be reconciled with T-3.1's
# matrices before Gate 02 sign-off, per plan.md's tier-lock rule.

min_floor: 6
formula: "max(min_floor, 2 * count(detectable_scenarios))"

categories:
  AST01:
    name: "Malicious Skills"
    tier_lock_hash: "41ab0facbcd32f2d5e385cd5bbcf15a40328162e8391fc717c2b7821510aa3ad"
    status: covered
    published_f1: "pending-detector"
    detectable_scenarios:
      - id: AST01-S1
        name: "Obfuscated malicious payload in script"
        tier: static-detectable
        reason: "A base64/hex-encoded shell payload decoded and exec'd at load or run time is a fixed byte pattern a static scanner can flag by decoding and matching against known dangerous shell primitives."
      - id: AST01-S2
        name: "Destructive postinstall hook"
        tier: static-detectable
        reason: "A declared postinstall/setup script performing destructive filesystem operations (e.g. recursive delete of $HOME) disguised as environment cleanup is a static command-pattern match against the manifest's declared lifecycle hooks."
      - id: AST01-S3
        name: "Covert exfiltration endpoint"
        tier: static-detectable
        reason: "A hardcoded HTTP endpoint in a script that POSTs local file contents outside any declared network policy is detectable by diffing egress calls in source against the manifest's declared allow-list."
    out_of_artifact_scenarios:
      []
    cases:
      - id: AST01-V1
        scenario_id: AST01-S1
        label: vulnerable
        path: fixtures/AST01/V1-obfuscated-payload/SKILL.md
      - id: AST01-C2
        scenario_id: AST01-S1
        label: clean
        path: fixtures/AST01/C2-obfuscated-payload/SKILL.md
      - id: AST01-V3
        scenario_id: AST01-S2
        label: vulnerable
        path: fixtures/AST01/V3-destructive-postinstall/SKILL.md
      - id: AST01-C4
        scenario_id: AST01-S2
        label: clean
        path: fixtures/AST01/C4-destructive-postinstall/SKILL.md
      - id: AST01-V5
        scenario_id: AST01-S3
        label: vulnerable
        path: fixtures/AST01/V5-exfiltration-endpoint/SKILL.md
      - id: AST01-C6
        scenario_id: AST01-S3
        label: clean
        path: fixtures/AST01/C6-exfiltration-endpoint/SKILL.md

