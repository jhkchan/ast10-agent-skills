      registry_scenarios: 6
      registry_static_detectable: 0
      registry_agent_judgable: 1
      registry_out_of_artifact: 5
      cases_at_full_static_coverage: null
      labeled_detectable_checks: 3
      declared_expected_cases: 6
      cases_present: 6
      uncovered_static_detectable:
        []
      note: >-
        The sharpest reconciliation finding. The registry tiers NONE of AST05's six named
        scenarios static-detectable: rug-pull needs the remote document at two points in
        time, bait-and-switch needs multiple fetch vantage points, chaining needs the chain
        followed, relay amplification needs the pipeline's per-node backbone models, DoS
        needs a runtime budget, and document-embedded instructions are agent-judgable. Every
        case in this corpus therefore measures an artifact_signal, never a named scenario.
        Any F1 published here must be labeled artifact-signal-only or it overclaims.
    detectable_scenarios:
      - id: AST05-S1
        name: "Unsanitized fetched instructions"
        tier: static-detectable
        registry_ids: [AST05-S01, AST05-S05]
        covers: artifact-signal-only
        reason: "A script that fetches remote content and appends it directly to the instruction/prompt path with no delimiter or provenance tag is a static data-flow check from a fetch call to the instruction sink. It is NOT coverage of AST05-S01 (Author Rug-Pull, out-of-artifact: the edit happens on a remote server after review) or AST05-S05 (agent-judgable); it measures the artifact_signal both scenarios declare — an unpinned external instruction reference routed into a sink with no boundary."
      - id: AST05-S2
        name: "Eval of remote response body"
        tier: static-detectable
        registry_ids: [AST05-S05]
        covers: artifact-signal-only
        reason: "A script that evaluates or exec's a third-party API response body directly as code is a static call-site match on eval/exec fed by a network response. It is NOT coverage of AST05-S05, which the registry tiers agent-judgable because the malicious document arrives at runtime and judging boundary adequacy is semantic; this pair measures that scenario's declared artifact_signal — fetched content routed into an executable sink."
      - id: AST05-S3
        name: "Absent instruction-boundary marker"
        tier: static-detectable
        registry_ids: [AST05-S04, AST05-S05]
        covers: artifact-signal-only
        reason: "Decision-rule text with no explicit boundary marker separating trusted operator instructions from untrusted tool/web output is a static presence/absence check for a declared delimiter convention. It is NOT coverage of AST05-S04 (Relay-Node Amplification, out-of-artifact: injection resistance is the minimum over the backbone models on the chain's path) or AST05-S05; it measures the artifact_signal both declare."
    out_of_artifact_scenarios:
      []
    cases:
      - id: AST05-V1
        scenario_id: AST05-S1
        label: vulnerable
        path: fixtures/AST05/V1-unsanitized-fetched-instructions/SKILL.md
      - id: AST05-C2
        scenario_id: AST05-S1
        label: clean
        path: fixtures/AST05/C2-unsanitized-fetched-instructions/SKILL.md
      - id: AST05-V3
        scenario_id: AST05-S2
        label: vulnerable
        path: fixtures/AST05/V3-eval-remote-response/SKILL.md
      - id: AST05-C4
        scenario_id: AST05-S2
        label: clean
        path: fixtures/AST05/C4-eval-remote-response/SKILL.md
      - id: AST05-V5
        scenario_id: AST05-S3
        label: vulnerable
        path: fixtures/AST05/V5-absent-boundary-marker/SKILL.md
      - id: AST05-C6
