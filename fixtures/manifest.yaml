# fixtures/manifest.yaml
#
# T-4.1 hand-built fixture-corpus label manifest.
#
# Sizing rule (spec.md gate-4, locked): cases = max(min_floor, 2 * count(detectable_scenarios)),
# class-balanced vulnerable/clean, drawn only from each category's static-detectable tier.
# A category whose detectable tier is empty publishes no F1 and is reported
# declared-and-uncovered rather than padded to manufacture a number (S-003).
#
# TWO TIER LOCKS (S-011). Both are checked by validators/tier_lock.py and by CI.
#
#   tier_lock_hash       corpus-internal. sha256 over sorted "scenario_id:tier" pairs
#                        across BOTH the detectable_scenarios and out_of_artifact_scenarios
#                        lists below. Catches an edit to THIS file.
#   registry_tier_lock   corpus-to-authority. The same hash construction over
#                        scenarios/registry.yaml's own scenarios for the category. Catches
#                        an edit to the AUTHORITY. It was added after a tier-doctrine review
#                        showed the CLI hashed only this file's embedded copy of the
#                        tiering, so flipping AST01-S10's tier in the authoritative registry
#                        left `python3 validators/tier_lock.py fixtures/manifest.yaml`
#                        printing "OK" and exiting 0. The per-category coverage-matrix.md
#                        files quote the same value.
#
# Either hash failing to recompute flags the category for re-labeling and a judge re-run
# before its F1 can be republished.
#
# ---------------------------------------------------------------------------------------
# PROVENANCE — RECONCILED AGAINST scenarios/registry.yaml (T-3.1a)
# ---------------------------------------------------------------------------------------
# scenarios/registry.yaml is now authoritative on tier. It enumerates all 62 attack
# scenarios named in the whitepaper's ten "Attack Scenarios" sections — not the 58 this
# file's earlier provenance note assumed; four scenarios appear as body sub-headings the
# document's own table of contents omits.
#
# Every scenario entry below now declares:
#   registry_ids  the registry scenario(s) it is drawn from (empty only for
#                 covers: category-precondition, which must then state a `derivation`).
#   covers        how honestly the fixture pair measures those scenarios:
#                   full                  — the registry tiers every linked scenario
#                                           static-detectable, so the corpus measures the
#                                           scenario itself.
#                   artifact-signal-only  — the registry does NOT tier the linked scenario
#                                           static-detectable; the corpus measures that
#                                           scenario's declared `artifact_signal` (an
#                                           enabling precondition) and MUST NOT be reported
#                                           as coverage of the scenario.
#                   category-precondition — the check derives from the category's preventive
#                                           mitigations rather than from any named scenario.
#
# Reconciliation outcomes (registry won in every case):
#   * AST02 / AST07 / AST09 / AST10 — the out-of-artifact declarations were partial. They
#     are re-keyed to canonical registry ids and exact whitepaper titles and expanded to
#     every out-of-artifact scenario the registry names for the category (AST02 1 -> 3,
#     AST07 2 -> 3, AST09 3 -> 7, AST10 2 -> 5). Tiers agreed; only completeness changed.
#   * AST05 — the registry tiers NONE of AST05's six named scenarios static-detectable.
#     The three labeled checks are re-declared covers: artifact-signal-only: this corpus
#     measures unpinned-reference / missing-boundary detection, NOT rug-pull,
#     bait-and-switch, chaining, or relay amplification. status covered -> proxy-covered.
#   * AST03 — two of three checks demoted to artifact-signal-only (the scenarios they
#     proxy are agent-judgable and out-of-artifact respectively). status -> proxy-covered.
#   * AST06 — one of three checks demoted to artifact-signal-only. status -> proxy-covered.
#   * AST08 — the single labeled check (AST08-S1, "no scan-attestation field") mapped to NO
#     named AST08 scenario and its six fixtures were three byte-identical vulnerable copies
#     and three byte-identical clean ones varying one frontmatter field that no detector
#     read. It is REPLACED, not demoted: the corpus is re-keyed to the four scenarios the
#     registry tiers static-detectable (AST08-S02, S04, S07, S08), each with its own
#     vulnerable/clean pair and its own detector function, at covers: full. status
#     proxy-covered -> covered, f1_scope category-precondition -> scenario-level,
#     declared_expected_cases 6 -> max(6, 2 x 4) = 8. The replaced check is not preserved
#     alongside: it labeled a precondition, not a scenario, and keeping it would have put
#     the entitlement at 10 for one field read. See skills/AST08/coverage-matrix.md.
#   * AST01 — the three checks map cleanly, but two of them to scenarios the registry files
#     under OTHER categories (AST08-S02 obfuscation, AST02-S03 config-file hijacking). The
#     link is recorded rather than reassigned; the fixtures are unchanged.
#   * AST04 — the corpus and the registry agreed on tier outright, but the corpus covered
#     only three of the registry's five static-detectable scenarios and its three pairs
#     carried their payloads as SKILL.md frontmatter strings no detector reads. It is
#     EXTENDED, not re-tiered: AST04-S4 (Permission Understating -> AST04-S02) and
#     AST04-S5 (Risk Tier Spoofing -> AST04-S03) are added at covers: full, the three
#     existing pairs are rewritten as real multi-file packages, and
#     declared_expected_cases moves 6 -> max(6, 2 x 5) = 10. uncovered_static_detectable
#     is now empty. tier_lock_hash recomputed; registry_tier_lock unchanged.
#   * AST03 (second pass) — the AST03-S1 pair claimed covers: full over AST03-S03 Identity
#     File Backdoors while varying a `/secrets/**` write glob that never named an identity
#     file. The FIXTURE was wrong, not the tier: both files were rewritten to request a
#     SOUL.md / MEMORY.md write and the directories renamed accordingly.
#
# CORPUS-SIZE FORMULA. Unchanged and still satisfied: declared_expected_cases =
# max(min_floor, 2 * count(detectable_scenarios)) over the checks this corpus actually
# labels, and every category still matches it. No detectable count changed, so no declared
# expected size moved. What the reconciliation DID change is the visible debt: the registry
# names 20 static-detectable scenarios across the ten categories and the count this corpus
# covers at covers: full is the one the per-category blocks below add up to — it moves as
# detectors land and is deliberately not restated as a frozen number here. Each category's
# registry_coverage block records
# cases_at_full_static_coverage — the corpus size the formula would demand at full registry
# coverage — alongside its uncovered_static_detectable list.
#
# ---------------------------------------------------------------------------------------
# ORPHAN-CORPUS RESOLUTION (tier-doctrine integrity review)
# ---------------------------------------------------------------------------------------
# fixtures/AST02/ and fixtures/AST07/ each held six labeled vulnerable/clean files that this
# manifest declared as zero cases. Both categories have an empty labeled detectable tier and
# publish no F1, so the corpora measured nothing and could not be reported.
#
# They are DELETED, and the reason is the signal-symmetry ruling recorded in
# scenarios/registry.yaml. AST07's six encoded exactly the artifact_signals the registry
# declares for AST07-S01 and AST07-S02 — absent signed content hash, unpinned update
# channel — plus one pair (absent version field) that proxies nothing named at all. Those
# signals ARE package-decidable, and that is precisely why they cannot become AST07 cases:
# the registry's defining_condition_rule bars an artifact_signal from counting as coverage,
# and S-003 bars a fixture bound to an out-of-artifact scenario outright. AST02's six were
# the same shape: a typosquat pair proxying an AST01 scenario the registry tiers
# agent-judgable, a pin-posture pair proxying AST02-S02's artifact_signal, and a
# lockfile-hash pair mapping to no named scenario.
#
# Keeping them would have meant either padding two categories that publish nothing —
# forbidden — or shipping labeled corpora that no manifest entry declares and no report can
# cite. Where a check on those signals is genuinely worth having it already exists as a
# named artifact-signal check with its own non-coverage declaration
# (skills/AST01/scripts/detector.py's AST01-content-hash-missing, covers:
# artifact-signal-only), which is where such a corpus would have to be filed if one is ever
# authored.

min_floor: 6
formula: "max(min_floor, 2 * count(detectable_scenarios))"
registry: "scenarios/registry.yaml"
registry_scenario_count: 62

categories:
  AST01:
    name: "Malicious Skills"
    # Re-keyed to scenarios/registry.yaml's canonical ids and exact whitepaper titles. The
    # corpus previously carried three checks under a private `AST01-S1/S2/S3` namespace that
    # no detector consumed; every labeled check is now a registry id, carries the detector
    # function that decides it, and is scored by that function over these bytes.
    tier_lock_hash: "b54f4c9cfae41c4e5e19215f5358d4093f7c40a06ea6d622ec11bc9f7139ae42"
    registry_tier_lock: "3f15f67d3b0e085cc109a7247063d7d79a0a784a8bb2aefb5db1bc2284d906fb"
    status: covered
    f1_scope: scenario-level
    # Recomputed by skills/AST01/scripts/test_ast01_detector.py from this corpus on every
    # run, so the number cannot drift from the bytes it was measured over. Read it for what
    # it is: 16 hand-authored cases whose author also wrote the detector. It measures that
    # each check decides its scenario's defining condition and clears a deliberately
    # near-miss control -- not field performance against skills in the wild.
    published_f1: "scenario-level 1.000 (8 labeled checks, n=16)"
    registry_coverage:
      registry_scenarios: 11
      registry_static_detectable: 7
      registry_agent_judgable: 3
      registry_out_of_artifact: 1
      cases_at_full_static_coverage: 14
      labeled_detectable_checks: 8
      declared_expected_cases: 16
      cases_present: 16
      uncovered_static_detectable:
        []
      note: >-
        All seven of AST01's registry static-detectable scenarios are now labeled and
        implemented. The corpus carries an eighth check -- AST08-S02 Obfuscated Instruction
        -- because the encoded-blob-into-an-execution-sink shape is a property of an AST01
        skill package's own bundled script even though the whitepaper files the scenario
        under AST08. Recorded, not reassigned, which is why the corpus (16 cases) exceeds
        the 14 that AST01's own seven scenarios entitle it to.
    detectable_scenarios:
      - id: AST01-S02
        name: "Social Engineering Prerequisites"
        tier: static-detectable
        registry_ids: [AST01-S02]
        covers: full
        detector_check: AST01-social-engineering-prerequisites
        reason: "Both halves of the scenario are in the package's prose: an instruction to run a remote-fetch-piped-to-shell command, and the host it points at. The pair varies only the host's presence in permissions.network.allow, so a detector matching the pipe-to-shell syntax alone scores 0.5 on it."
      - id: AST01-S05
        name: "SOUL.md Persistence"
        tier: static-detectable
        registry_ids: [AST01-S05]
        covers: full
        detector_check: AST01-soul-md-persistence
        reason: "A write to the agent identity file, decided from a declared write scope that survives deny_write-wins evaluation or from a bundled script opening that path for write. The clean half performs the identical append against the skill's own notes file."
      - id: AST01-S06
        name: "Memory Poisoning"
        tier: static-detectable
        registry_ids: [AST01-S06]
        covers: full
        detector_check: AST01-memory-poisoning
        reason: "The same mechanism against the memory file, exercised through the declaration route: the vulnerable half grants write to MEMORY.md with the floor beneath it silent on that path, and the clean half declares the identical grant with the floor covering it, so USF's most-specific-wins rule decides the pair."
      - id: AST01-S08
        name: "Identity Cloning and Impersonation"
        tier: static-detectable
        registry_ids: [AST01-S08]
        covers: full
        detector_check: AST01-identity-clone-exfiltration
        reason: "A read of an identity artifact plus the outbound send that follows it, in one bundled script. Both halves of the pair post to the same DECLARED host, so the pair isolates the conjunction and cannot be passed by an egress check."
      - id: AST01-S09
        name: "WebSocket Hijacking"
        tier: static-detectable
        registry_ids: [AST01-S09]
        covers: full
        detector_check: AST01-websocket-c2
        reason: "A WebSocket-scheme client against a host absent from the declared allowlist. The clean half opens the identical channel to a declared host, so a scheme match alone scores 0.5."
      - id: AST01-S10
        name: "Data Exfiltration"
        tier: static-detectable
        registry_ids: [AST01-S10]
        covers: full
        detector_check: AST01-undeclared-egress
        reason: "An egress destination hardcoded in a bundled script and absent from the manifest's declared allowlist -- the in-package diff between what the code does and what the manifest promises. The clean half is the same read and the same post to a declared host: only the declaration changed."
      - id: AST01-S11
        name: "Hidden Prompt Injection in Skill Output"
        tier: static-detectable
        registry_ids: [AST01-S11]
        covers: full
        detector_check: AST01-hidden-output-injection
        reason: "A concealment carrier inside the content the skill returns. Scoped to output templates rather than to the package at large, which is what keeps it distinct from AST04/AST08's carrier scan; the clean half ships the same output contract with no carrier."
      - id: AST08-S02
        name: "Obfuscated Instruction"
        tier: static-detectable
        registry_ids: [AST08-S02]
        covers: full
        detector_check: AST01-obfuscated-payload-exec
        reason: "An encoded blob decoded into an execution sink, with a bounded decode-then-rescan of the payload. Filed under AST08 by the whitepaper and decided here from an AST01 package's own bundled script; the link is recorded, not reassigned. The clean half decodes the identical construct and writes it to a file, so matching base64 alone scores 0.5."
    out_of_artifact_scenarios:
      []
    cases:
      - id: AST01-V1
        scenario_id: AST08-S02
        label: vulnerable
        path: fixtures/AST01/V1-obfuscated-payload-exec/SKILL.md
      - id: AST01-C2
        scenario_id: AST08-S02
        label: clean
        path: fixtures/AST01/C2-obfuscated-payload-exec/SKILL.md
      - id: AST01-V3
        scenario_id: AST01-S02
        label: vulnerable
        path: fixtures/AST01/V3-social-engineering-prereq/SKILL.md
      - id: AST01-C4
        scenario_id: AST01-S02
        label: clean
        path: fixtures/AST01/C4-social-engineering-prereq/SKILL.md
      - id: AST01-V5
        scenario_id: AST01-S05
        label: vulnerable
        path: fixtures/AST01/V5-soul-md-persistence/SKILL.md
      - id: AST01-C6
        scenario_id: AST01-S05
        label: clean
        path: fixtures/AST01/C6-soul-md-persistence/SKILL.md
      - id: AST01-V7
        scenario_id: AST01-S06
        label: vulnerable
        path: fixtures/AST01/V7-memory-poisoning/SKILL.md
      - id: AST01-C8
        scenario_id: AST01-S06
        label: clean
        path: fixtures/AST01/C8-memory-poisoning/SKILL.md
      - id: AST01-V9
        scenario_id: AST01-S08
        label: vulnerable
        path: fixtures/AST01/V9-identity-clone-exfiltration/SKILL.md
      - id: AST01-C10
        scenario_id: AST01-S08
        label: clean
        path: fixtures/AST01/C10-identity-clone-exfiltration/SKILL.md
      - id: AST01-V11
        scenario_id: AST01-S09
        label: vulnerable
        path: fixtures/AST01/V11-websocket-c2/SKILL.md
      - id: AST01-C12
        scenario_id: AST01-S09
        label: clean
        path: fixtures/AST01/C12-websocket-c2/SKILL.md
      - id: AST01-V13
        scenario_id: AST01-S10
        label: vulnerable
        path: fixtures/AST01/V13-undeclared-egress/SKILL.md
      - id: AST01-C14
        scenario_id: AST01-S10
        label: clean
        path: fixtures/AST01/C14-undeclared-egress/SKILL.md
      - id: AST01-V15
        scenario_id: AST01-S11
        label: vulnerable
        path: fixtures/AST01/V15-hidden-output-injection/SKILL.md
      - id: AST01-C16
        scenario_id: AST01-S11
        label: clean
        path: fixtures/AST01/C16-hidden-output-injection/SKILL.md

  AST02:
    name: "Supply Chain Compromise"
    # Re-keyed to scenarios/registry.yaml's canonical ids and exact whitepaper titles, and
    # expanded from one out-of-artifact declaration to all three the registry names. The
    # category's ONE static-detectable scenario (AST02-S03) is now labeled and implemented
    # here rather than booked to AST01's corpus, which is where it previously sat: the pair
    # that carried it varied a `postinstall` value and never exercised the project-open
    # trigger that is the scenario's defining condition. That pair is gone; these six cases
    # exercise the three surfaces the whitepaper names (hooks, MCP settings, environment
    # overrides) with the trigger intact.
    tier_lock_hash: "a5f7bcfdeb219c2a30da4e7cb492933bb33ec67390fea7117a36045e0793622c"
    registry_tier_lock: "a5f7bcfdeb219c2a30da4e7cb492933bb33ec67390fea7117a36045e0793622c"
    status: covered
    f1_scope: scenario-level
    # Recomputed from this corpus by skills/AST02/scripts/test_ast02_detector.py. Six
    # hand-authored cases, each clean half a deliberate near-miss of its vulnerable half:
    # the same settings file with no execution path, the same `env` block with variables
    # that steer nothing, the same task command with no folder-open trigger.
    published_f1: "scenario-level 1.000 (AST02-S03, n=8)"
    registry_coverage:
      registry_scenarios: 4
      registry_static_detectable: 1
      registry_agent_judgable: 0
      registry_out_of_artifact: 3
      cases_at_full_static_coverage: 6
      labeled_detectable_checks: 1
      declared_expected_cases: 6
      cases_present: 8
      uncovered_static_detectable:
        []
      note: >-
        One labeled check for the category's one static-detectable scenario. The other
        three scenarios are out-of-artifact and are published as such below rather than
        proxied: for two of them the registry records no artifact_signal at all, and the
        third (AST02-S02's pin posture) is a proxy the never-pad rule forbids labeling as
        AST02 coverage. Three quarters of this category's named attack surface is still
        not decidable from one package, and that has not changed.
    detectable_scenarios:
      - id: AST02-S03
        name: "Config-File Hijacking"
        tier: static-detectable
        registry_ids: [AST02-S03]
        covers: full
        detector_check: AST02-config-file-hijacking
        reason: "A command-bearing value under a key the host auto-executes at project open, inside a config file that ships with the package. The four vulnerable cases are the three surfaces the whitepaper names -- a SessionStart hook command, an ANTHROPIC_BASE_URL override, and an editor task declared runOn: folderOpen -- plus a Codex `.codex/config.toml` MCP entry whose command/args spawn a process, and each clean case is the same file and the same command with only the auto-execution trigger removed, so a command-string grep scores 0.5 on this corpus."
    out_of_artifact_scenarios:
      - id: AST02-S01
        name: "Registry Flooding"
        tier: out-of-artifact
        registry_ids: [AST02-S01]
        covers: full
        reason: "Coordinated bulk publication is a property of the registry's corpus over time; one package is indistinguishable from one member of a flood and from one honest publication (scenarios/registry.yaml AST02-S01)."
      - id: AST02-S02
        name: "Dependency Confusion"
        tier: out-of-artifact
        registry_ids: [AST02-S02]
        covers: full
        reason: "The defining condition is which package the resolver selects at install time, which needs the resolution namespace and the registry's contents. The lockfile's pinning posture is only an artifact_signal, not the scenario (scenarios/registry.yaml AST02-S02)."
      - id: AST02-S04
        name: "Maintainer Account Takeover"
        tier: out-of-artifact
        registry_ids: [AST02-S04]
        covers: full
        reason: "Registry-side account-compromise detection depends on registry auth logs and session history maintained outside the artifact; a release signed with the legitimate key after a takeover is byte-indistinguishable from an honest one, so no in-artifact signal exists (scenarios/registry.yaml AST02-S04; skills/AST02/scripts/detector.py SCENARIO_TIERS agrees)."
    cases:
      - id: AST02-V1
        scenario_id: AST02-S03
        label: vulnerable
        path: fixtures/AST02/V1-hook-command-on-session-start/SKILL.md
      - id: AST02-C2
        scenario_id: AST02-S03
        label: clean
        path: fixtures/AST02/C2-hook-command-on-session-start/SKILL.md
      - id: AST02-V3
        scenario_id: AST02-S03
        label: vulnerable
        path: fixtures/AST02/V3-control-plane-env-override/SKILL.md
      - id: AST02-C4
        scenario_id: AST02-S03
        label: clean
        path: fixtures/AST02/C4-control-plane-env-override/SKILL.md
      - id: AST02-V5
        scenario_id: AST02-S03
        label: vulnerable
        path: fixtures/AST02/V5-folder-open-task/SKILL.md
      - id: AST02-C6
        scenario_id: AST02-S03
        label: clean
        path: fixtures/AST02/C6-folder-open-task/SKILL.md
      - id: AST02-V7
        scenario_id: AST02-S03
        label: vulnerable
        path: fixtures/AST02/V7-codex-mcp-server-spawn/SKILL.md
      - id: AST02-C8
        scenario_id: AST02-S03
        label: clean
        path: fixtures/AST02/C8-codex-mcp-server-spawn/SKILL.md

  AST03:
    name: "Over-Privileged Skills"
    tier_lock_hash: "c7090f29a229e96da46014b3b1606a0adaed6ea01a9a32f87e7340edfc54062e"
    registry_tier_lock: "e54b26ff23820840a724cc4ac9db658c8cadb92422b3c3eee06d05138c7ce59d"
    status: proxy-covered
    f1_scope: mixed-proxy
    # Two figures, never one. AST03's corpus mixes one covers: full pair with two
    # proxy pairs, and averaging the six cases would report 1-of-5 named-scenario
    # coverage as though it were category coverage. Reproduce with
    # `python3 detectors/fixture_loader.py AST03`.
    published_f1: "scenario-level 1.00 (AST03-S03, n=2); artifact-signal-only 1.00 (n=4)"
    registry_coverage:
      registry_scenarios: 5
      registry_static_detectable: 1
      registry_agent_judgable: 1
      registry_out_of_artifact: 3
      cases_at_full_static_coverage: 6
      labeled_detectable_checks: 3
      declared_expected_cases: 6
      cases_present: 6
      uncovered_static_detectable:
        []
      note: >-
        Only one of the three labeled checks measures a named scenario (AST03-S03 Identity
        File Backdoors). The other two measure artifact_signals for an agent-judgable
        scenario (AST03-S01) and an out-of-artifact one (AST06-S02), so two thirds of this
        category's F1 is proxy F1 and must be reported as such. FIXTURE CORRECTION (detector
        wiring): the AST03-S1 pair previously varied an `allow_write: ["/secrets/**"]` glob
        and claimed covers: full over AST03-S03 Identity File Backdoors on the strength of
        being "generalised ... from identity files to a sensitive-path list". It did not
        encode the scenario — AST03-S03's defining condition names SOUL.md / MEMORY.md /
        AGENTS.md and the pair never mentioned them — so the two files were rewritten to
        request an identity-file write, and the directories renamed from
        `*-prod-secrets-write-scope` to `*-identity-file-write-grant`. The claim was wrong,
        not the tier.
    detectable_scenarios:
      - id: AST03-S1
        name: "Identity-file write grant"
        tier: static-detectable
        registry_ids: [AST03-S03]
        covers: full
        detector_check: AST03-identity-file-write-grant
        reason: "A declared write permission that reaches SOUL.md, MEMORY.md or AGENTS.md and is not shadowed by deny_write is registry scenario AST03-S03's defining condition verbatim, and USF's most-specific-wins precedence makes it decidable from the manifest alone. The vulnerable case names two identity files in `write` while declaring a deny_write floor that omits them — the shape a length-only deny_write check passes; the clean case declares a non-identity write and pins all three identity files in deny_write, so the pair varies reach, not the presence of a write scope."
      - id: AST03-S2
        name: "Unrestricted shell grant alongside unbounded egress"
        tier: static-detectable
        registry_ids: [AST03-S01]
        covers: artifact-signal-only
        detector_check: AST03-shell-network-privilege-combo
        reason: "An execution primitive together with an unbounded outbound channel, with the stated function ('formats markdown tables') held fixed across the pair. It is NOT coverage of registry scenario AST03-S01, which the registry tiers agent-judgable because 'far beyond what it needs' is a purpose-versus-scope judgement; this pair measures that scenario's declared artifact_signal only. Cross-fire is expected and honest: the vulnerable case also satisfies AST03-wildcard-network-egress, because it genuinely declares blanket egress. Each check is scored only over its own labeled pair (detectors/fixture_loader.py), so the two are never blended."
      - id: AST03-S3
        name: "Wildcard network egress"
        tier: static-detectable
        registry_ids: [AST06-S02]
        covers: artifact-signal-only
        detector_check: AST03-wildcard-network-egress
        reason: "A network allowlist containing a wildcard host ('*') instead of an enumerated host list is a static structural check on the manifest field, and AST03's own mitigation asks for exactly that shape ('adopt network allowlists scoped to specific domains, not a binary network: true/false'). It is NOT coverage of registry scenario AST06-S02 (Network Pivot), which the registry tiers out-of-artifact because the pivot depends on the host's sandbox and co-located services; this pair measures that scenario's declared artifact_signal only. Shell stays closed in both cases so the conjunctive combo check cannot fire on either."
    out_of_artifact_scenarios:
      []
    cases:
      - id: AST03-V1
        scenario_id: AST03-S1
        label: vulnerable
        path: fixtures/AST03/V1-identity-file-write-grant/SKILL.md
      - id: AST03-C2
        scenario_id: AST03-S1
        label: clean
        path: fixtures/AST03/C2-identity-file-write-grant/SKILL.md
      - id: AST03-V3
        scenario_id: AST03-S2
        label: vulnerable
