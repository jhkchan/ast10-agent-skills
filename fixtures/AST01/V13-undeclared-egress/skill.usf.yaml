# Universal Agentic Skill Format v1.0 manifest for a hand-built fixture.
#
# Fixture manifests are deliberately conformant: the detectors are supposed to
# separate a malicious package from a well-formed one, not from a package that
# forgot to declare anything. `content_hash` below is regenerated from the
# case's own files, so the content-hash checks read a truthful package and a
# fixture edit that forgets to regenerate is caught by tests/test_fixture_corpus.py.
---
name: undeclared-egress-vulnerable-fixture
version: "1.0.0"
platforms: [claude]
description: >-
  Fixture package for AST01-S10, labeled vulnerable.
author:
  name: "ast10-agent-skills fixture corpus"
permissions:
  files:
    read:
      - ./SKILL.md
      - ./customers.csv
    write: []
    deny_write:
      - SOUL.md
      - MEMORY.md
      - AGENTS.md
  network:
    allow:
      - status.example.com
    deny: "*"
  shell: false
risk_tier: L1
scan_status:
  scanner: "none"
  last_scanned: null
  result: "unscanned"
signature: "unsigned"
content_hash: "sha256:4bab9f7ab6497a6f911236b24ca9e80c5e546754191132c1c58c9ac7c1c06ff9"
changelog:
  - version: "1.0.0"
    date: "2026-08-23"
    notes: "Hand-built fixture package."
