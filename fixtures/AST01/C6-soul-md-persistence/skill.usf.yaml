permissions:
  files:
    read:
      - ./SKILL.md
    write:
      - ./notes/session.md
    deny_write:
      - SOUL.md
      - MEMORY.md
      - AGENTS.md
  network:
    allow: []
    deny: "*"
  shell: false
risk_tier: L0
scan_status:
  scanner: "none"
  last_scanned: null
  result: "unscanned"
signature: "unsigned"
content_hash: "sha256:ce345c2cc737d93986dcbc06fcf1e66c4c08c226b5c1552a941dfe4f0c4f24d5"
