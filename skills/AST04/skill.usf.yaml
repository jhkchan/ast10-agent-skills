# Universal Agentic Skill Format v1.0 manifest.
#
#   schema:    ../../schemas/usf-v1.schema.json
#   validator: ../../validators/usf.py
#   check:     python3 validators/usf.py skills/AST04/skill.usf.yaml
#
# Part of `owasp-ast10-agent-skills`, an independent community reference
# implementation of the OWASP Agentic Skills Top 10 whitepaper's AST10 proposal.
# This is NOT an OWASP project and carries no OWASP endorsement.
---
name: ast04-insecure-metadata
version: "1.0.0"

# Declared only for the runtime this package is authored and tested against.
# Adding a platform is a re-validation event, not an edit: AST10's premise is
# that a skill's security properties are lost in translation between runtimes.
platforms: [claude, codex, cursor, openclaw, pi, vscode]

description: >-
  Read-only triage of OWASP AST04 Insecure Metadata: checks manifest parsing, schema
  conformance, and unicode smuggling in skill frontmatter.

author:
  name: "owasp-ast10-agent-skills contributors"
  # `identity` and `signing_key` are written by scripts/sign_usf.py in the same
  # operation as `signature` below, and both are INSIDE the signed payload. A
  # signature whose key anchors to nothing is the false trust signal AST10 warns
  # about, so the signer cannot produce one without the anchor, and neither field
  # can be swapped for another publisher's without breaking the signature.
  # The key is published at https://jhkchan.github.io/.well-known/did.json; this
  # anchor is worth exactly as much as control of that domain and its TLS. A
  # verified signature answers "who published this", never "is this safe".
  identity: "did:web:jhkchan.github.io"
  signing_key: "ed25519:77fb87cd4a46dd524190f72cee510d0ad934b0df4acc40366f9b8a8dc87593a6"

permissions:
  # Paths are relative to the skill package under review, which the host supplies
  # as the working directory. Explicit paths only, no wildcards (USF v1.0).
  files:
    read:
      # The JSON and TOML manifests are read as well: this category's rule is that YAML,
      # JSON and TOML findings are not interchangeable.
      - ./SKILL.md
      - ./skill.usf.yaml
      - ./skill.json
      - ./pyproject.toml
    # The detector is pure: it returns findings and writes nothing.
    write: []
    deny_write:
      # Kept even though `write` is empty. `write: []` is a property of this
      # package; `deny_write` is a floor that has to survive a port to a runtime
      # whose default is write-everything (AST10 implicit privilege escalation).
      - SOUL.md
      - MEMORY.md
      - AGENTS.md
  network:
    # No egress. Default-deny with an empty allowlist means no host is reachable.
    allow: []
    # Redundant with the default-deny above, per the whitepaper; kept for
    # explicit auditability so a reviewer sees an intent, not an omission.
    deny: "*"
  shell: false
  tools:
    - read_file

requires:
  # scripts/detector.py is pure Python; no other binary is invoked.
  binaries: [python3]

# Derived floor from the permissions above is also L0 (read-only, no egress,
# no shell). The validator recomputes this rather than trusting the field.
risk_tier: L0

scan_status:
  scanner: "none"
  last_scanned: null
  # Declared unscanned, never omitted: an absent scan_status is indistinguishable
  # from one stripped during a port, which is the AST10 failure itself.
  result: "unscanned"

# ed25519 over the RFC 8785 (JCS) canonical JSON serialization of this manifest
# with `signature` removed and `content_hash` kept, so this one value covers both
# the package bytes and the identity anchor above. Written and re-checked by
# scripts/sign_usf.py; anyone can check it against the published key with:
#   python3 scripts/sign_usf.py verify --identity did:web:jhkchan.github.io
signature: "ed25519:2afcc574f6661090036a2c9b326e9a6e298d68c0ef507ef68cf5bddae0056d348f87c86cc72c7985ea6816bf3ad189e5edc1c840e43c03a58e9fa1a3402c3202"

# sha256 over this skill's shipped surface as defined by scripts/content_hash.py
# (SKILL.md, references/*.md, scripts/*.py, evals/evals.json). This file is
# outside that surface, which is what stops the hash depending on the field that
# carries it. Regenerate with:
#   python3 validators/usf.py --update-content-hash skills/AST04/skill.usf.yaml
content_hash: "sha256:cf37cb38e32c9823310543b1009cd7aa818876df4aee6d4a789580cf2076d92a"

changelog:
  - version: "1.0.0"
    date: "2026-08-23"
    notes: "Initial Universal Skill Format manifest for the AST04 skill."
